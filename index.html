<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123c32">
<title>DukaanOS | Retail Management</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --g:#147d58;
  --d:#123c32;
  --bg:#f3f6f5;
  --b:#dfe8e3;
  --t:#172b25;
  --m:#718078;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--t);
  font:15px Arial,sans-serif;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hide{display:none!important}

.top{
  background:var(--d);
  color:white;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  gap:10px;
  align-items:center;
}

.mark{
  background:#24a66e;
  border-radius:12px;
  padding:12px 16px;
  font-size:22px;
  font-weight:bold;
}

.top h1{font-size:20px;margin:0}
.top p{margin:4px 0 0;color:#c5ded3}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:14px;
}

.nav{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:4px 0 14px;
}

.nav button{
  white-space:nowrap;
  background:white;
  border:1px solid var(--b);
  border-radius:10px;
  padding:11px;
}

.nav button.active,.btn{
  background:var(--g);
  color:white;
  border:0;
}

.btn{
  border-radius:9px;
  padding:11px 14px;
}

.secondary{
  background:#e7f1ec;
  color:var(--d);
}

.danger{
  background:#fff0f0;
  color:#c33;
}

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin:8px 0 16px;
}

.title h2{margin:0;font-size:25px}
.title p{margin:6px 0;color:var(--m)}

.stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}

.stat,.card{
  background:white;
  border:1px solid var(--b);
  border-radius:15px;
  padding:16px;
}

.stat .i{font-size:24px}
.stat small{display:block;color:var(--m);margin-top:10px}
.stat strong{display:block;font-size:25px;margin-top:8px}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin-top:14px;
}

.tablewrap{
  overflow:auto;
  background:white;
  border:1px solid var(--b);
  border-radius:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:580px;
}

th,td{
  text-align:left;
  padding:11px;
  border-bottom:1px solid var(--b);
  font-size:13px;
}

th{background:#f8faf9;color:#52635b}
.empty{text-align:center;color:var(--m);padding:22px}

.formgrid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{font-size:13px;color:#52635b}

.field input,.field select,.field textarea{
  width:100%;
  border:1px solid #ccd9d2;
  border-radius:9px;
  padding:11px;
  background:white;
}

.field textarea{min-height:65px}
.full{grid-column:1/-1}

.actions{
  display:flex;
  gap:5px;
  white-space:nowrap;
}

.small{padding:7px 9px;font-size:12px}

.toolbar{
  display:flex;
  gap:8px;
  margin:12px 0;
}

.toolbar input,.toolbar select{
  padding:10px;
  border:1px solid #ccd9d2;
  border-radius:9px;
  min-width:0;
}

.toolbar input{flex:1}

.badge{
  background:#e7f6ed;
  color:#177548;
  border-radius:20px;
  padding:4px 8px;
  font-size:11px;
}

.warn{background:#fff3db;color:#996000}

.alert{
  background:#fff3db;
  color:#825400;
  padding:10px;
  border-radius:8px;
  margin:12px 0;
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  background:linear-gradient(145deg,#123c32,#147d58);
}

.loginbox{
  background:white;
  border-radius:18px;
  padding:24px;
  width:min(100%,440px);
}

.loginbox h2{margin-top:24px}
.loginbox p,.note{color:var(--m);line-height:1.5}
.loginbox .field{margin:12px 0}
.note{font-size:12px}

.toast{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  background:#173f33;
  color:white;
  padding:12px 16px;
  border-radius:10px;
  z-index:9;
  max-width:90%;
}

@media(max-width:760px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid{grid-template-columns:1fr}
  .formgrid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .wrap{padding:11px}
  .stat{padding:13px}
  .stat strong{font-size:22px}
}
</style>
</head>

<body>

<section id="login" class="login">
  <div class="loginbox">
    <div class="logo">
      <div class="mark">D</div>
      <div>
        <h1>DukaanOS</h1>
        <p>Smart Retail Management</p>
      </div>
    </div>

    <h2 id="authTitle">Welcome back</h2>
    <p id="authSub">Sign in to manage your shop.</p>

    <div id="authErr" class="alert hide"></div>

    <form id="authForm">
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" required autocomplete="email">
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password" required minlength="6">
      </div>

      <button class="btn" id="authSubmit"
        style="width:100%;margin-top:8px">
        Sign in
      </button>
    </form>

    <button class="btn secondary" id="toggleAuth"
      style="width:100%;margin-top:10px">
      Create account
    </button>

    <p class="note">
      If email confirmation is enabled, confirm your email before signing in.
      Keep your password private.
    </p>
  </div>
</section>

<section id="app" class="hide">
  <header class="top">
    <div class="logo">
      <div class="mark">D</div>
      <div>
        <h1>DukaanOS</h1>
        <p>Smart Retail Management</p>
      </div>
    </div>
    <button class="btn secondary" id="shopBtn">MY SHOP</button>
  </header>

  <main class="wrap">
    <nav class="nav" id="nav">
      <button class="active" data-page="dashboard">📊 Dashboard</button>
      <button data-page="products">📦 Products</button>
      <button data-page="sales">🧾 Sales</button>
      <button data-page="customers">👥 Customers</button>
      <button data-page="suppliers">🏢 Suppliers</button>
      <button data-page="purchases">🛒 Purchases</button>
      <button data-page="expenses">💸 Expenses</button>
      <button data-page="warranty">🛡️ Warranty</button>
      <button data-page="reports">📈 Reports</button>
      <button data-page="settings">⚙️ Settings</button>
    </nav>

    <div id="content"></div>

    <p class="note">
      DukaanOS • Verify stock, invoices and tax details before using for accounting.
    </p>
  </main>
</section>

<div id="toast" class="toast hide"></div>

<script>

/* SUPABASE CONNECTION */

const SUPABASE_URL='https://nzhevftkptwllmdzsdnh.supabase.co';

const SUPABASE_PUBLISHABLE_KEY='PASTE_YOUR_SB_PUBLISHABLE_KEY_HERE';

let db,session,page='dashboard',mode='signin';
let profile={shop_name:'My Shop'},cache={};

const $=id=>document.getElementById(id);

const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{
  maximumFractionDigits:2
});

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
}[c]));

function toast(s){
  $('toast').textContent=s;
  $('toast').classList.remove('hide');
  setTimeout(()=>$('toast').classList.add('hide'),3000);
}

function authError(s){
  $('authErr').textContent=s;
  $('authErr').classList.remove('hide');
}

function authRefresh(){
  $('authTitle').textContent=
    mode==='signin'?'Welcome back':'Create your account';

  $('authSub').textContent=
    mode==='signin'
      ?'Sign in to manage your shop.'
      :'Create a shop account using your email.';

  $('authSubmit').textContent=
    mode==='signin'?'Sign in':'Create account';

  $('toggleAuth').textContent=
    mode==='signin'?'Create account':'Already registered? Sign in';

  $('password').autocomplete=
    mode==='signin'?'current-password':'new-password';
}

$('toggleAuth').onclick=()=>{
  mode=mode==='signin'?'signup':'signin';
  $('authErr').classList.add('hide');
  authRefresh();
};

$('authForm').onsubmit=async e=>{
  e.preventDefault();

  if(!db){
    authError('Setup needed: add your Supabase Publishable Key in index.html.');
    return;
  }

  try{
    let r=mode==='signin'
      ?await db.auth.signInWithPassword({
        email:$('email').value.trim(),
        password:$('password').value
      })
      :await db.auth.signUp({
        email:$('email').value.trim(),
        password:$('password').value
      });

    if(r.error)throw r.error;

    if(mode==='signup'&&!r.data.session){
      authError('Account created. Check email confirmation, then sign in.');
      return;
    }

    if(r.data.session){
      session=r.data.session;
      await start();
    }
  }catch(x){
    authError(x.message||'Authentication failed');
  }
};

$('nav').onclick=e=>{
  let b=e.target.closest('[data-page]');
  if(!b)return;

  page=b.dataset.page;

  document.querySelectorAll('#nav button').forEach(x=>{
    x.classList.toggle('active',x===b);
  });

  render();
};

$('shopBtn').onclick=()=>go('settings');

function go(p){
  page=p;
  document.querySelectorAll('#nav button').forEach(x=>{
    x.classList.toggle('active',x.dataset.page===p);
  });
  render();
}

async function init(){
  authRefresh();

  if(!window.supabase){
    return authError('Could not load Supabase library. Check your internet connection.');
  }

  if(
    !SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_') &&
    !SUPABASE_PUBLISHABLE_KEY.startsWith('eyJ')
  ){
    return authError('Setup needed: replace the Publishable Key placeholder in index.html.');
  }

  db=window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  let r=await db.auth.getSession();

  if(r.data.session){
    session=r.data.session;
    await start();
  }

  db.auth.onAuthStateChange((_e,s)=>{
    session=s;

    if(!s){
      $('app').classList.add('hide');
      $('login').classList.remove('hide');
    }
  });
}

async function start(){
  if(!session)return;

  $('login').classList.add('hide');
  $('app').classList.remove('hide');

  try{
    let r=await db.from('profiles')
      .select('*')
      .eq('id',session.user.id)
      .maybeSingle();

    if(r.data){
      profile=r.data;
    }else{
      let n=await db.from('profiles')
        .insert({
          id:session.user.id,
          shop_name:'My Shop'
        })
        .select()
        .single();

      if(!n.error)profile=n.data;
    }
  }catch(e){
    console.error(e);
  }

  $('shopBtn').textContent=profile.shop_name||'MY SHOP';
  await render();
}

async function rows(t,order='created_at',asc=false){
  let r=await db.from(t)
    .select('*')
    .order(order,{ascending:asc})
    .limit(1000);

  if(r.error)throw r.error;

  cache[t]=r.data||[];
  return cache[t];
}

async function insert(t,obj){
  let r=await db.from(t).insert({
    ...obj,
    user_id:session.user.id
  });

  if(r.error)throw r.error;
}

async function update(t,id,obj){
  let r=await db.from(t)
    .update(obj)
    .eq('id',id);

  if(r.error)throw r.error;
}

function heading(t,s,button=''){
  return `<div class="title">
    <div>
      <h2>${t}</h2>
      <p>${s}</p>
    </div>
    ${button}
  </div>`;
}

function stat(i,l,v){
  return `<div class="stat">
    <div class="i">${i}</div>
    <small>${l}</small>
    <strong>${v}</strong>
  </div>`;
}

function table(h,body){
  return `<div class="tablewrap">
    <table>
      <thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead>
      <tbody>
        ${body||`<tr><td colspan="${h.length}" class="empty">No records yet</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

function act(t,id){
  return `<div class="actions">
    <button class="btn secondary small"
      onclick="editRec('${t}','${id}')">Edit</button>
    <button class="btn danger small"
      onclick="delRec('${t}','${id}')">Delete</button>
  </div>`;
}
  /* =========================
   PART 2: DASHBOARD & RECORDS
========================= */

async function render(){
  const c=$('content');
  c.innerHTML='<div class="card">Loading data...</div>';

  try{
    if(page==='dashboard')await renderDashboard();
    else if(page==='products')await renderProducts();
    else if(page==='sales')await renderSales();
    else if(page==='customers')await renderCustomers();
    else if(page==='suppliers')await renderSuppliers();
    else if(page==='purchases')await renderPurchases();
    else if(page==='expenses')await renderExpenses();
    else if(page==='warranty')await renderWarranty();
    else if(page==='reports')await renderReports();
    else if(page==='settings')await renderSettings();
  }catch(e){
    c.innerHTML=`
      <div class="card">
        <h3>Data load error</h3>
        <p>${esc(e.message)}</p>
        <button class="btn" onclick="render()">Retry</button>
      </div>`;
  }
}

/* DASHBOARD */

async function renderDashboard(){
  const [p,s,e,c]=await Promise.all([
    rows('products','created_at'),
    rows('sales','created_at'),
    rows('expenses','created_at'),
    rows('customers','created_at')
  ]);

  const today=new Date().toISOString().slice(0,10);

  const todays=s.filter(x=>
    String(x.created_at||'').slice(0,10)===today
  );

  const revenue=todays.reduce((a,x)=>a+Number(x.total||0),0);

  const low=p.filter(x=>
    Number(x.stock||0)<=Number(x.min_stock||0)
  );

  $('content').innerHTML=
    heading('Dashboard','Your shop business overview')+
    `<div class="stats">
      ${stat('💰',"Today's Sales",money(revenue))}
      ${stat('🧾','Total Bills',s.length)}
      ${stat('📦','Products',p.length)}
      ${stat('⚠️','Low Stock',low.length)}
      ${stat('👥','Customers',c.length)}
      ${stat('💸','Total Expenses',money(
        e.reduce((a,x)=>a+Number(x.amount||0),0)
      ))}
      ${stat('📈','All-time Sales',money(
        s.reduce((a,x)=>a+Number(x.total||0),0)
      ))}
      ${stat('🛡️','Warranty Items',p.filter(x=>x.warranty_end).length)}
    </div>
    <div class="grid">
      <div class="card">
        <h3>Quick Actions</h3>
        <button class="btn" onclick="go('products')">+ Add Product</button>
        <button class="btn secondary" onclick="go('sales')">+ New Sale</button>
        <button class="btn secondary" onclick="go('customers')">+ Customer</button>
        <button class="btn secondary" onclick="go('purchases')">+ Purchase</button>
      </div>
      <div class="card">
        <h3>Low Stock Alerts</h3>
        ${low.length
          ?low.slice(0,10).map(x=>
            `<p>⚠️ ${esc(x.name)} — Stock: ${Number(x.stock||0)}</p>`
          ).join('')
          :'<p>No low-stock products.</p>'}
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <h3>Recent Sales</h3>
      ${table(
        ['Bill No.','Date','Customer','Amount','Payment'],
        s.slice(0,10).map(x=>`
          <tr>
            <td>${esc(x.bill_no||'-')}</td>
            <td>${esc(String(x.created_at||'').slice(0,10))}</td>
            <td>${esc(x.customer_name||'Walk-in')}</td>
            <td>${money(x.total)}</td>
            <td>${esc(x.payment_method||'-')}</td>
          </tr>
        `).join('')
      )}
    </div>`;
}

/* PRODUCT FORM */

async function productForm(id=null){
  let p=id?(cache.products||[]).find(x=>x.id===id):null;

  $('content').innerHTML=
    heading(id?'Edit Product':'Add Product','Product and stock details')+
    `<div class="card">
      <form id="productForm" class="formgrid">
        <div class="field full">
          <label>Product Name *</label>
          <input name="name" required value="${esc(p?.name||'')}"
            placeholder="e.g. Samsung Galaxy A55">
        </div>

        <div class="field">
          <label>Category *</label>
          <select name="category" required>
            ${[
              'New Mobile','Old Mobile','Accessories','TV',
              'Refrigerator','Washing Machine','Air Conditioner',
              'Other Electronics','Repair / Service'
            ].map(x=>`
              <option ${p?.category===x?'selected':''}>${x}</option>
            `).join('')}
          </select>
        </div>

        <div class="field">
          <label>Brand</label>
          <input name="brand" value="${esc(p?.brand||'')}">
        </div>

        <div class="field">
          <label>Model / Variant</label>
          <input name="model" value="${esc(p?.model||'')}">
        </div>

        <div class="field">
          <label>Color</label>
          <input name="color" value="${esc(p?.color||'')}">
        </div>

        <div class="field">
          <label>IMEI 1</label>
          <input name="imei1" value="${esc(p?.imei1||'')}">
        </div>

        <div class="field">
          <label>IMEI 2 / Serial Number</label>
          <input name="imei2" value="${esc(p?.imei2||'')}">
        </div>

        <div class="field">
          <label>Purchase Price (₹) *</label>
          <input name="cost" type="number" min="0" step=".01"
            value="${Number(p?.cost||0)}" required>
        </div>

        <div class="field">
          <label>Selling Price (₹) *</label>
          <input name="price" type="number" min="0" step=".01"
            value="${Number(p?.price||0)}" required>
        </div>

        <div class="field">
          <label>Stock Quantity *</label>
          <input name="stock" type="number" min="0"
            value="${Number(p?.stock||0)}" required>
        </div>

        <div class="field">
          <label>Minimum Stock Alert</label>
          <input name="min_stock" type="number" min="0"
            value="${Number(p?.min_stock||1)}">
        </div>

        <div class="field">
          <label>Purchase Date</label>
          <input name="purchase_date" type="date"
            value="${esc(p?.purchase_date||'')}">
        </div>

        <div class="field">
          <label>Warranty (Months)</label>
          <input name="warranty_months" type="number" min="0"
            value="${Number(p?.warranty_months||0)}">
        </div>

        <div class="field full">
          <label>Notes</label>
          <textarea name="notes">${esc(p?.notes||'')}</textarea>
        </div>

        <div class="actions full">
          <button class="btn" type="submit">Save Product</button>
          <button class="btn secondary" type="button"
            onclick="go('products')">Cancel</button>
        </div>
      </form>
    </div>`;

  $('productForm').onsubmit=async ev=>{
    ev.preventDefault();

    const d=Object.fromEntries(new FormData(ev.target).entries());

    d.cost=Number(d.cost);
    d.price=Number(d.price);
    d.stock=Number(d.stock);
    d.min_stock=Number(d.min_stock||0);
    d.warranty_months=Number(d.warranty_months||0);

    if(d.imei1){
      const duplicate=(cache.products||[]).some(x=>
        x.imei1===d.imei1&&x.id!==id
      );

      if(duplicate){
        alert('This IMEI already exists.');
        return;
      }
    }

    try{
      if(id){
        await update('products',id,d);
      }else{
        await insert('products',d);
      }

      toast('Product saved successfully.');
      await renderProducts();
    }catch(e){
      alert('Save failed: '+e.message);
    }
  };
}

/* PRODUCTS / INVENTORY */

async function renderProducts(){
  const p=await rows('products','created_at');

  $('content').innerHTML=
    heading('Products & Inventory','Manage mobiles, electronics and stock',
      '<button class="btn" onclick="productForm()">+ Add Product</button>')+
    `<div class="toolbar">
      <input id="productSearch" placeholder="Search name, brand, model or IMEI">
    </div>
    <div id="productList"></div>`;

  $('productSearch').oninput=showProducts;
  showProducts();
}

function showProducts(){
  const q=($('productSearch')?.value||'').toLowerCase();

  const list=(cache.products||[]).filter(p=>
    [p.name,p.brand,p.model,p.imei1,p.imei2,p.category]
      .some(x=>String(x||'').toLowerCase().includes(q))
  );

  $('productList').innerHTML=table(
    ['Product','Category','IMEI / Serial','Cost','Price','Stock','Actions'],
    list.map(p=>`
      <tr>
        <td><strong>${esc(p.name)}</strong><br>
          <small>${esc(p.brand||'')} ${esc(p.model||'')}</small>
        </td>
        <td>${esc(p.category||'-')}</td>
        <td>${esc(p.imei1||p.imei2||'-')}</td>
        <td>${money(p.cost)}</td>
        <td>${money(p.price)}</td>
        <td>
          <span class="badge ${
            Number(p.stock)<=Number(p.min_stock)?'warn':''
          }">${Number(p.stock||0)}</span>
        </td>
        <td>
          <div class="actions">
            <button class="btn secondary small"
              onclick="productForm('${p.id}')">Edit</button>
            <button class="btn danger small"
              onclick="delRec('products','${p.id}')">Delete</button>
          </div>

/* BILLING / SALES */

async function renderSales(){
  const products=await rows('products','created_at');
  const customers=await rows('customers','created_at');
  const sales=await rows('sales','created_at');

  $('content').innerHTML=
    heading('Billing & Sales','Create bills and manage sales')+
    `<div class="card">
      <form id="saleForm" class="formgrid">
        <div class="field full">
          <label>Product *</label>
          <select id="saleProduct" required>
            <option value="">Select Product</option>
            ${products.filter(p=>Number(p.stock)>0).map(p=>`
              <option value="${p.id}">
                ${esc(p.name)} — Stock ${p.stock} — ${money(p.price)}
              </option>
            `).join('')}
          </select>
        </div>

        <div class="field">
          <label>Quantity *</label>
          <input id="saleQty" type="number" min="1" value="1" required>
        </div>

        <div class="field">
          <label>Selling Price (₹)</label>
          <input id="salePrice" type="number" min="0" step=".01" required>
        </div>

        <div class="field full">
          <label>Customer</label>
          <select id="saleCustomer">
            <option value="">Walk-in Customer</option>
            ${customers.map(c=>`
              <option value="${c.id}">${esc(c.name)}</option>
            `).join('')}
          </select>
        </div>

        <div class="field">
          <label>Payment Method</label>
          <select id="salePayment">
            <option>Cash</option>
            <option>UPI</option>
            <option>Card</option>
            <option>Bank Transfer</option>
            <option>Credit</option>
          </select>
        </div>

        <div class="field full">
          <button class="btn">Complete Sale</button>
        </div>
      </form>
    </div>

    <div class="card" style="margin-top:15px">
      <h3>Recent Sales</h3>
      <div id="salesTable"></div>
    </div>`;

  $('saleProduct').onchange=()=>{
    const p=products.find(x=>x.id===$('saleProduct').value);
    $('salePrice').value=p?p.price:'';
    $('saleQty').max=p?p.stock:1;
  };

  $('saleForm').onsubmit=async e=>{
    e.preventDefault();

    const product=products.find(x=>x.id===$('saleProduct').value);
    const qty=Number($('saleQty').value);
    const price=Number($('salePrice').value);

    if(!product)return alert('Select a product.');
    if(qty<1||qty>Number(product.stock))
      return alert('Insufficient stock.');
    if(price<0)return alert('Invalid price.');

    const customer=customers.find(
      x=>x.id===$('saleCustomer').value
    );

    const total=qty*price;
    const bill='BILL-'+Date.now();

    try{
      await insert('sales',{
        bill_no:bill,
        customer_id:customer?.id||null,
        customer_name:customer?.name||'Walk-in',
        total:total,
        profit:(price-Number(product.cost||0))*qty,
        payment_method:$('salePayment').value
      });

      await update('products',product.id,{
        stock:Number(product.stock)-qty
      });

      await insert('sale_items',{
        sale_id:(await latestSaleId(bill)),
        product_id:product.id,
        product_name:product.name,
        quantity:qty,
        price:price,
        total:total
      });

      alert('Sale completed successfully!');
      await renderSales();
    }catch(err){
      alert('Sale error: '+err.message);
    }
  };

  $('salesTable').innerHTML=table(
    ['Bill No.','Date','Customer','Total','Payment'],
    sales.map(s=>`
      <tr>
        <td>${esc(s.bill_no||'-')}</td>
        <td>${esc(String(s.created_at||'').slice(0,10))}</td>
        <td>${esc(s.customer_name||'Walk-in')}</td>
        <td>${money(s.total)}</td>
        <td>${esc(s.payment_method||'-')}</td>
      </tr>
    `).join('')
  );
}

async function latestSaleId(bill){
  const {data,error}=await supabase
    .from('sales')
    .select('id')
    .eq('bill_no',bill)
    .single();

  if(error)throw error;
  return data.id;
}

async function exportSales(){
  const sales=await rows('sales','created_at');

  const data=[
    ['Bill No','Date','Customer','Amount','Profit','Payment'],
    ...sales.map(s=>[
      s.bill_no||'',
      s.created_at||'',
      s.customer_name||'',
      s.total||0,
      s.profit||0,
      s.payment_method||''
    ])
  ];

  const csv=data.map(row=>
    row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')
  ).join('\r\n');

  const blob=new Blob(['\uFEFF'+csv],{
    type:'text/csv;charset=utf-8;'
  });

  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');

  a.href=url;
  a.download='DukaanOS-Sales.csv';
  a.click();

  URL.revokeObjectURL(url);
}

/* GENERAL HELPERS */

function heading(title,description,button=''){
  return `
    <div class="page-title">
      <div>
        <h2>${esc(title)}</h2>
        <p>${esc(description)}</p>
      </div>
      ${button}
    </div>`;
}

function stat(icon,label,value){
  return `
    <div class="stat-card">
      <div class="stat-icon">${icon}</div>
      <div class="stat-label">${esc(label)}</div>
      <div class="stat-value">${esc(String(value))}</div>
    </div>`;
}

function table(headers,body){
  return `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>
        </thead>
        <tbody>
          ${body||`<tr><td colspan="${headers.length}" class="empty">
            No records found
          </td></tr>`}
        </tbody>
      </table>
    </div>`;
}

function money(value){
  return '₹'+Number(value||0).toLocaleString('en-IN',{
    maximumFractionDigits:2
  });
}

function esc(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[ch]));
}

function toast(message){
  alert(message);
}

async function delRec(tableName,id){
  if(!confirm('Are you sure you want to delete this record?'))return;

  try{
    const {error}=await supabase
      .from(tableName)
      .delete()
      .eq('id',id);

    if(error)throw error;

    alert('Record deleted.');
    await render();
  }catch(err){
    alert('Delete failed: '+err.message);
  }
  }
